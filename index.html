<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabsi's & Finn's Wiedersehen ❤️</title>
    <style>
        :root {
            /* Sommerliches Babyhellblau */
            --bg-gradient: linear-gradient(135deg, #e1f5fe 0%, #81d4fa 100%);
            --container-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(179, 229, 252, 0.6) 100%);
            --text-main: #01579b; /* Tiefes Ozeanblau für guten Kontrast */
            --accent-pink: #ff7043; /* Sommerliches Korallen-Orange */
            --label-color: #0277bd;
            --separator-color: rgba(1, 87, 155, 0.2);
            --shadow: rgba(1, 87, 155, 0.15);
            --event-bg: rgba(255, 255, 255, 0.5);
            --glint-color: rgba(255, 255, 255, 0.8);
            /* Sonnengelb/Oranger Verlauf für die Zahlen */
            --main-gradient: linear-gradient(120deg, #ff9800, #ffca28, #ff9800);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #333;
            padding: 60px 0;
        }

        .umbrella {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.5rem;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(-15deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(80px) rotate(15deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 5rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 950px;
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(15px);
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container:hover { transform: translateY(-8px); }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 { color: var(--text-main); font-weight: 500; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 2.5rem; margin-top: 0; }
        .events-title { font-size: 1.1rem; color: var(--text-main); margin: 40px 0 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        .heart { display: inline-block; color: #ff7043; animation: heartbeat 1.5s ease-in-out infinite; font-size: 2.5rem; vertical-align: middle; }
        @keyframes heartbeat { 
            0%, 30%, 60% { transform: scale(1); } 
            15% { transform: scale(1.2); } 
            45% { transform: scale(1.1); } 
        }

        .countdown-wrapper { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
        .unit-group { display: flex; flex-direction: column; align-items: center; }
        
        .number {
            font-size: 5rem;
            font-weight: 900;
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 1;
            background-image: var(--main-gradient);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label { font-size: 0.8rem; color: var(--label-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; font-weight: bold; }
        .separator { font-size: 3rem; color: var(--separator-color); font-weight: 200; margin-bottom: 25px; }

        .progress-container { width: 80%; max-width: 600px; height: 12px; background: rgba(0, 0, 0, 0.08); border-radius: 10px; margin: 30px auto 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff7043, #ffd54f); transition: width 1s ease-out; }

        .weeks-display { margin: 10px 0 40px; padding-bottom: 25px; border-bottom: 1px solid var(--separator-color); font-size: 1.3rem; color: var(--text-main); font-weight: 300; }
        .sleep-count { display: block; font-size: 1.1rem; color: #ff7043; margin-top: 8px; font-weight: bold; }
        .minutes-count { display: block; font-size: 1rem; color: var(--label-color); margin-top: 5px; font-weight: 400; }

        .events-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .event-card { background: var(--event-bg); padding: 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.8); transition: all 0.3s ease; }

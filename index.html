<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabsi's & Finn's Wiedersehen ❤️</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e1f5fe 0%, #81d4fa 100%);
            --container-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(179, 229, 252, 0.65) 100%);
            --text-main: #01579b;
            --accent-pink: #ff4081;
            --label-color: #0277bd;
            --separator-color: rgba(1, 87, 155, 0.2);
            --shadow: rgba(1, 87, 155, 0.15);
            --event-bg: rgba(255, 255, 255, 0.55);
            --glint-color: rgba(255, 255, 255, 0.8);
            --main-gradient: linear-gradient(120deg, #ff4081, #ff9800, #ffeb3b, #ff4081);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #333;
            padding: 60px 0;
        }

        .umbrella {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.5rem;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(-15deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(80px) rotate(15deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 5rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 950px;
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(15px);
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container:hover { transform: translateY(-8px); }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 { color: var(--text-main); font-weight: 500; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 2.5rem; margin-top: 0; }
        .events-title { font-size: 1.1rem; color: var(--text-main); margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        .heart { display: inline-block; color: var(--accent-pink); animation: heartbeat 1.5s ease-in-out infinite; font-size: 2.5rem; vertical-align: middle; }
        @keyframes heartbeat { 
            0%, 30%, 60% { transform: scale(1); } 
            15% { transform: scale(1.2); } 
            45% { transform: scale(1.1); } 
        }

        .countdown-wrapper { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
        .unit-group { display: flex; flex-direction: column; align-items: center; }
        
        .number {
            font-size: 5rem;
            font-weight: 900;
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 1;
            background-image: var(--main-gradient);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label { font-size: 0.8rem; color: var(--label-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; font-weight: bold; }
        .separator { font-size: 3rem; color: var(--separator-color); font-weight: 200; margin-bottom: 25px; }

        .progress-container { width: 80%; max-width: 600px; height: 12px; background: rgba(0, 0, 0, 0.08); border-radius: 10px; margin: 30px auto 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff4081, #ffeb3b); transition: width 1s ease-out; }

        .weeks-display { margin: 10px 0 30px; padding-bottom: 25px; border-bottom: 1px solid var(--separator-color); font-size: 1.3rem; font-weight: 300; display: flex; flex-direction: column; align-items: center; }
        .stat-row { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .minutes-count { font-size: 1rem; margin-top: 6px; font-weight: 400; }
        .sleep-count { font-size: 1.1rem; margin-top: 8px; font-weight: bold; }

        @keyframes textShine {
            0% { background-position: 150% center; }
            100% { background-position: -50% center; }
        }

        .glow-main {
            background: linear-gradient(110deg, var(--text-main) 35%, #40c4ff 50%, var(--text-main) 65%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 8s linear infinite;
        }

        .glow-label {
            background: linear-gradient(110deg, var(--label-color) 35%, #81d4fa 50%, var(--label-color) 65%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 8s linear infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 64, 129, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 64, 129, 0.5); }
            100% { box-shadow: 0 0 10px rgba(255, 64, 129, 0.2); }
        }

        .anniversary-message {
            display: none;
            margin: 0 auto 25px;
            padding: 12px 25px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.9));
            border: 2px solid var(--accent-pink);
            border-radius: 20px;
            color: var(--accent-pink);
            font-size: 1.2rem;
            font-weight: bold;
            animation: pulseGlow 3s infinite;
            text-align: center;
            max-width: 80%;
        }

        .events-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; width: 100%; }
        .event-card { background: var(--event-bg); padding: 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.8); transition: all 0.3s ease; }
        .event-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 1); border-color: var(--accent-pink); }
        .event-date { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        .event-name { display: block; font-size: 1rem; color: var(--text-main); font-weight: bold; }
        
        .event-card.past { opacity: 0.65; background: rgba(255, 255, 255, 0.4); border-color: transparent; }
        .event-card.past:hover { opacity: 1; border-color: var(--label-color); transform: translateY(-2px); }

        @media (max-width: 900px) {
            .number { font-size: 2.8rem; }
            .countdown-wrapper { gap: 12px; }
            .separator { font-size: 1.5rem; }
            h1 { font-size: 1.6rem; }
            .container { padding: 4rem 1.5rem; min-height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wiedersehen von Rabsi und Finn <span class="heart">❤️</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group" id="box-days"><span class="number" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator" id="sep-days">:</div>
            
            <div class="unit-group" id="box-hours"><span class="number" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator" id="sep-hours">:</div>
            
            <div class="unit-group" id="box-mins"><span class="number" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator" id="sep-mins">:</div>
            
            <div class="unit-group" id="box-secs"><span class="number" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            <span class="stat-row">
                <span class="glow-main">Das entspricht noch etwa <span id="weeks-count">0</span> Wochen.</span>
            </span>
            <span class="stat-row minutes-count">
                <span class="glow-label" style="animation-delay: 1.5s;">Das entspricht etwa <span id="minutes-total">0</span> Minuten.</span> ⏳
            </span>
            <span class="stat-row sleep-count">
                <span class="glow-label" style="animation-delay: 3s;">Nur noch <span id="sleep-total">0</span> Mal schlafen!</span> 🌙
            </span>
        </div>

        <div id="anniversary-message" class="anniversary-message"></div>

        <div class="events-title">Highlights 🗓️</div>
        <div class="events-list">
            <div class="event-card past">
                <span class="event-date">27. August</span>
                <span class="event-name">Wiedersehen! ✅</span>
            </div>
            <div class="event-card past">
                <span class="event-date">29. August</span>
                <span class="event-name">Pizzera & Jaus ✅</span>
            </div>
            <div class="event-card">
                <span class="event-date">24. Oktober</span>
                <span class="event-name">Wiedersehen! 🥂</span>
            </div>
        </div>
    </div>

    <script>
        function createUmbrella() {
            const umbrella = document.createElement('div');
            umbrella.innerHTML = '⛱️';
            umbrella.className = 'umbrella';
            umbrella.style.left = Math.random() * 100 + 'vw';
            umbrella.style.fontSize = Math.random() * 15 + 20 + 'px';
            umbrella.style.animationDuration = Math.random() * 5 + 6 + 's';
            umbrella.style.opacity = Math.random() * 0.4 + 0.6;
            document.body.appendChild(umbrella);
            setTimeout(() => { umbrella.remove(); }, 11000);
        }
        setInterval(createUmbrella, 600);

        const targetDate = new Date('October 24, 2026 17:00:00');
        const startDate = new Date('September 05, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = "<h1>Endlich wieder vereint! <span class='heart'>❤️</span></h1>";
                return;
            }

            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');

            document.getElementById('box-days').style.display = (d === 0) ? 'none' : 'flex';
            document.getElementById('sep-days').style.display = (d === 0) ? 'none' : 'block';

            document.getElementById('box-hours').style.display = (d === 0 && h === 0) ? 'none' : 'flex';
            document.getElementById('sep-hours').style.display = (d === 0 && h === 0) ? 'none' : 'block';

            document.getElementById('box-mins').style.display = (d === 0 && h === 0 && m === 0) ? 'none' : 'flex';
            document.getElementById('sep-mins').style.display = (d === 0 && h === 0 && m === 0) ? 'none' : 'block';

            document.getElementById('weeks-count').innerText = (diff / 604800000).toFixed(1).replace('.', ',');

            const totalMinutes = Math.floor(diff / 60000);
            document.getElementById('minutes-total').innerText = totalMinutes.toLocaleString('de-DE');

            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            let refDay = now.getDate();
            if (now.getHours() < 3) refDay -= 1;
            const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);
            document.getElementById('sleep-total').innerText = Math.max(0, Math.round((targetDay - referenceDate) / 86400000));

            const progress = Math.min(Math.max(((now.getTime() - startDate) / (targetDate.getTime() - startDate)) * 100, 0), 100);
            document.getElementById('progress-bar').style.width = progress + '%';

            const currentMonth = now.getMonth(); 
            const currentDay = now.getDate();
            const messageBox = document.getElementById('anniversary-message');
            
            if (currentMonth === 2 && currentDay === 28) {
                const years = now.getFullYear() - 2026;
                if (years > 0) {
                    messageBox.innerHTML = `🎉 Alles Gute zum ${years}. Jahrestag! ❤️`;
                    messageBox.style.display = 'block';
                }
            } else if (currentMonth === 8 && currentDay === 28) {
                messageBox.innerHTML = "✨ Alles Gute zum Halbjährigen! 🥰";
                messageBox.style.display = 'block';
            } else {
                messageBox.style.display = 'none';
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Glow: Rabsi & Finn</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff59d 0%, #f48fb1 100%);
            --container-bg: linear-gradient(135deg, rgba(255, 249, 196, 0.7) 0%, rgba(248, 187, 208, 0.7) 100%);
            --text-main: #880e4f;
            --accent-pink: #e91e63;
            --accent-yellow: #fbc02d;
            --label-color: #5d4037;
            --separator-color: rgba(233, 30, 99, 0.2);
            --shadow: rgba(136, 14, 79, 0.15);
            --event-bg: rgba(255, 255, 255, 0.4);
            --glint-color: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Verhindert Ruckeln durch Layout-Shifts */
            position: relative;
            color: #333;
            padding: 20px 0;
        }

        /* Optimierte Blütenblätter */
        .petal {
            position: absolute;
            top: -10vh;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            will-change: transform; /* Sagt dem Browser: Das hier wird animiert */
            animation: drift linear forwards;
        }

        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translate3d(100px, 110vh, 0) rotate(720deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 3rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 950px;
            text-align: center;
            backdrop-filter: blur(10px); /* Leicht reduziert für Performance */
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.4);
            overflow: hidden;
            /* Transform für flüssigeres Hover */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backface-visibility: hidden;
        }

        .container:hover {
            transform: translate3d(0, -8px, 0);
        }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
            will-change: left;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 { color: var(--text-main); font-size: 2rem; margin-bottom: 2.5rem; font-weight: 500; }
        .heart { display: inline-block; color: #e91e63; animation: heartbeat 1.5s ease-in-out infinite; font-size: 2.5rem; vertical-align: middle; }

        @keyframes heartbeat {
            0%, 30%, 60% { transform: scale(1); }
            15% { transform: scale(1.15); }
            45% { transform: scale(1.05); }
        }

        .countdown-wrapper { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 20px; }
        .number {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(120deg, #d81b60, #fbc02d, #d81b60);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 0.9;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label { font-size: 0.9rem; color: var(--label-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }
        .separator { font-size: 4rem; color: var(--separator-color); font-weight: 200; margin-top: -25px; }

        .progress-container { width: 80%; max-width: 600px; height: 12px; background: rgba(0, 0, 0, 0.05); border-radius: 10px; margin: 35px auto 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #e91e63, #fbc02d); transition: width 1s ease-out; }

        .weeks-display { margin: 10px 0 30px; padding-bottom: 30px; border-bottom: 1px solid var(--separator-color); font-size: 1.3rem; color: var(--text-main); font-weight: 300; }
        .sleep-count { display: block; font-size: 1.1rem; color: #774d5e; margin-top: 8px; }

        .events-title { font-size: 1.1rem; color: var(--text-main); margin: 25px 0 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .events-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .event-card { background: var(--event-bg); padding: 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.5); transition: transform 0.3s ease; }
        .event-card:hover { transform: translate3d(0, -5px, 0); background: rgba(255, 255, 255, 0.8); }

        @media (max-width: 900px) {
            .countdown-wrapper { gap: 12px; }
            .number { font-size: 3rem; }
            .separator { font-size: 2rem; margin-top: -15px; }
            h1 { font-size: 1.4rem; }
            .container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zeit bis zum Wiedersehen von Finn und Rabsi <span class="heart">❤️</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group"><span class="number" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            Das entspricht noch etwa <span id="weeks-count">0</span> Wochen.
            <span class="sleep-count">Nur noch <span id="sleep-total">0</span> Mal schlafen! 🌙</span>
        </div>

        <div class="events-title">Highlights 🗓️</div>
        <div class="events-list">
            <div class="event-card">
                <span class="event-name" style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 5px;">14. Mai</span>
                <span style="font-weight: bold; color: var(--text-main);">Wiedersehen! 🥂</span>
            </div>
            <div class="event-card">
                <span class="event-name" style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 5px;">30. Juli</span>
                <span style="font-weight: bold; color: var(--text-main);">The Weeknd Konzert 🎤</span>
            </div>
        </div>
    </div>

    <script>
        // Optimierte Blüten-Erzeugung
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = Math.random() > 0.5 ? '🌸' : '🌼';
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = Math.random() * 8 + 12 + 'px';
            petal.style.animationDuration = Math.random() * 4 + 6 + 's';
            petal.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(petal);
            
            // Sofortiges Entfernen nach Ablauf der Animation spart RAM
            setTimeout(() => { petal.remove(); }, 10000);
        }
        
        // Etwas seltener neue Blüten erzeugen schont die CPU
        setInterval(createPetal, 600);

        const targetDate = new Date('May 14, 2026 18:00:00');
        const startDate = new Date('April 03, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = "<h1>Endlich wieder vereint! <span class='heart'>❤️</span></h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');

            const weeks = (diff / (1000 * 60 * 60 * 24 * 7)).toFixed(1);
            document.getElementById('weeks-count').innerText = weeks.replace('.', ',');

            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            let refDay = now.getDate();
            if (now.getHours() < 3) refDay -= 1;
            const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);
            const sleepDiff = Math.round((targetDay - referenceDate) / (1000 * 60 * 60 * 24));
            
            document.getElementById('sleep-total').innerText = Math.max(0, sleepDiff);

            const totalDuration = targetDate.getTime() - startDate;
            const elapsed = now.getTime() - startDate;
            const progressPercent = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);
            document.getElementById('progress-bar').style.width = progressPercent + '%';
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>

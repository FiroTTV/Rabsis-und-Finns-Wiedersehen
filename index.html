<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabsi's & Finn's Wiedersehen ❤️</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff59d 0%, #f48fb1 100%);
            --container-bg: linear-gradient(135deg, rgba(255, 249, 196, 0.6) 0%, rgba(248, 187, 208, 0.6) 100%);
            --text-main: #880e4f;
            --accent-pink: #e91e63;
            --accent-yellow: #fbc02d;
            --label-color: #5d4037;
            --separator-color: rgba(233, 30, 99, 0.2);
            --shadow: rgba(136, 14, 79, 0.15);
            --event-bg: rgba(255, 255, 255, 0.4);
            --glint-color: rgba(255, 255, 255, 0.6);
            --summer-gradient: linear-gradient(120deg, #f39c12, #e67e22, #fbc02d, #f39c12);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            width: 100vw;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
            color: #333;
        }

        .petal {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.2rem;
        }

        @keyframes drift {
            to { transform: translate3d(100px, 110vh, 0) rotate(720deg); }
        }

        .container {
            background: var(--container-bg);
            padding: 3rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 950px;
            text-align: center;
            backdrop-filter: blur(15px);
            z-index: 10;
            position: relative;
            margin-top: 5vh;
            border: 1px solid rgba(255, 255, 255, 0.4);
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1, h2 { color: var(--text-main); font-weight: 500; letter-spacing: 1px; margin-top: 0; }
        h1 { font-size: 2rem; margin-bottom: 2rem; }
        h2 { font-size: 1.6rem; margin: 35px 0 15px; text-transform: uppercase; }

        .heart { display: inline-block; color: #e91e63; animation: heartbeat 1.5s infinite; font-size: 2.2rem; vertical-align: middle; }
        @keyframes heartbeat { 0%, 30%, 60% { transform: scale(1); } 15% { transform: scale(1.2); } }

        .countdown-wrapper { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .unit-group { display: flex; flex-direction: column; align-items: center; }
        
        .number {
            font-size: 5rem;
            font-weight: 900;
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 1;
        }

        .number.main { background-image: linear-gradient(120deg, #d81b60, #fbc02d, #d81b60); }
        .number.summer { background-image: var(--summer-gradient); font-size: 3.5rem; }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label { font-size: 0.8rem; color: var(--label-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }
        .separator { font-size: 3rem; color: var(--separator-color); font-weight: 200; margin-bottom: 25px; }

        .progress-container { width: 80%; max-width: 600px; height: 12px; background: rgba(0, 0, 0, 0.05); border-radius: 10px; margin: 30px auto 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #e91e63, #fbc02d); transition: width 1s ease-out; }

        .weeks-display { margin: 10px 0 20px; padding-bottom: 20px; border-bottom: 1px solid var(--separator-color); font-size: 1.2rem; color: var(--text-main); font-weight: 300; }
        .sleep-count { display: block; font-size: 1.1rem; color: #774d5e; margin-top: 8px; font-weight: bold; }

        .events-list { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .event-card { background: var(--event-bg); padding: 12px 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.5); min-width: 130px; }
        .event-name { color: var(--text-main); font-weight: bold; font-size: 0.9rem; display: block; }

        @media (max-width: 900px) {
            .number { font-size: 2.8rem; }
            .number.summer { font-size: 2.2rem; }
            .countdown-wrapper { gap: 12px; }
            .separator { font-size: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .container { padding: 2rem 1.5rem; margin-top: 3vh; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="page-title">Finn und Rabsi <span class="heart">❤️</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group"><span class="number main" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number main" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number main" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number main" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            Das entspricht noch etwa <span id="weeks-count">0</span> Wochen.
            <span class="sleep-count">Nur noch <span id="sleep-total">0</span> Mal schlafen! 🌙</span>
        </div>

        <!-- Dieser Bereich wird nach dem 13. Mai ausgeblendet, da der Sommer-Countdown dann nach oben rutscht -->
        <div id="summer-section">
            <h2>☀️ Sommer ☀️</h2>
            <div class="countdown-wrapper">
                <div class="unit-group"><span class="number summer" id="s-days">00</span><span class="label">Tage</span></div>
                <div class="separator">:</div>
                <div class="unit-group"><span class="number summer" id="s-hours">00</span><span class="label">Std</span></div>
                <div class="separator">:</div>
                <div class="unit-group"><span class="number summer" id="s-mins">00</span><span class="label">Min</span></div>
            </div>
        </div>

        <div class="events-list">
            <div class="event-card">
                <span style="color: #888; font-size: 0.7rem; display: block;">13. Mai</span>
                <span class="event-name">Wiedersehen! 🥂</span>
            </div>
            <div class="event-card">
                <span style="color: #888; font-size: 0.7rem; display: block;">30. Juli</span>
                <span class="event-name">The Weeknd 🎤</span>
            </div>
        </div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = Math.random() > 0.5 ? '🌸' : '🌼';
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = Math.random() * 10 + 10 + 'px';
            petal.style.animationDuration = Math.random() * 5 + 6 + 's';
            petal.style.opacity = Math.random() * 0.6 + 0.3;
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 600);

        const reunionTarget = new Date('May 13, 2026 18:30:00');
        const summerTarget = new Date('July 06, 2026 20:00:00');
        
        // Startdaten für den Fortschrittsbalken
        const startForReunion = new Date('April 03, 2026 00:00:00').getTime();
        const startForSummer = new Date('May 13, 2026 18:30:00').getTime();

        function update() {
            const now = new Date();
            const timeToReunion = reunionTarget - now;
            const timeToSummer = summerTarget - now;

            let activeTarget, activeStart, isSummerPhase = false;

            if (timeToReunion > 0) {
                // Phase 1: Warten auf Wiedersehen
                activeTarget = reunionTarget;
                activeStart = startForReunion;
                document.getElementById('summer-section').style.display = 'block';
                document.getElementById('page-title').innerHTML = 'Finn und Rabsi <span class="heart">❤️</span>';
            } else {
                // Phase 2: Warten auf Sommer
                activeTarget = summerTarget;
                activeStart = startForSummer;
                isSummerPhase = true;
                document.getElementById('summer-section').style.display = 'none';
                document.getElementById('page-title').innerHTML = 'Warten auf den Sommer <span class="heart">☀️</span>';
                
                // Wir ändern die Farben der Zahlen auf Sommer-Gold
                const numbers = document.querySelectorAll('.number.main');
                numbers.forEach(n => n.style.backgroundImage = 'linear-gradient(120deg, #f39c12, #e67e22, #fbc02d, #f39c12)');
            }

            const diff = activeTarget - now;

            if (diff > 0) {
                // Haupt-Zahlen aktualisieren
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                
                // Wochen & Schlafen
                document.getElementById('weeks-count').innerText = (diff / 604800000).toFixed(1).replace('.', ',');
                
                const targetDay = new Date(activeTarget.getFullYear(), activeTarget.getMonth(), activeTarget.getDate());
                let refDay = now.getDate();
                if (now.getHours() < 3) refDay -= 1;
                const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);
                document.getElementById('sleep-total').innerText = Math.max(0, Math.round((targetDay - referenceDate) / 86400000));
                
                // Balken
                const progress = Math.min(Math.max(((now.getTime() - activeStart) / (activeTarget.getTime() - activeStart)) * 100, 0), 100);
                document.getElementById('progress-bar').style.width = progress + '%';
            }

            // Kleiner Sommer-Countdown (nur in Phase 1 sichtbar)
            if (!isSummerPhase && timeToSummer > 0) {
                document.getElementById('s-days').innerText = Math.floor(timeToSummer / 86400000).toString().padStart(2, '0');
                document.getElementById('s-hours').innerText = Math.floor((timeToSummer % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('s-mins').innerText = Math.floor((timeToSummer % 3600000) / 60000).toString().padStart(2, '0');
            }
        }

        setInterval(update, 1000);
        update();
    </script>
</body>
</html>

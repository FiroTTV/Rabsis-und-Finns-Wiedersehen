<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frühlings-Wiedersehen: Rabsi & Finn</title>
    <style>
        :root {
            /* Frühlings-Darkmode Palette */
            --bg-gradient: linear-gradient(135deg, #0a1a0f 0%, #1a0a14 100%);
            --container-bg: radial-gradient(circle at center, #1b2e1f 0%, #121212 100%);
            --text-main: #f48fb1; /* Kirschblüte */
            --accent-spring: #c5e1a5; /* Junges Grün */
            --star-color: #fff59d; /* Sanftes Gelb */
            --label-color: #a5d6a7;
            --separator-color: #388e3c;
            --shadow: rgba(0,0,0,0.6);
            --event-bg: rgba(197, 225, 165, 0.05);
            --glint-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: white;
            padding: 20px 0;
        }

        /* Blütenblätter-Animation (statt Sterne) */
        .petal {
            position: absolute;
            top: -50px;
            color: var(--text-main);
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.2rem;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 4rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 1000px;
            text-align: center;
            backdrop-filter: blur(15px);
            z-index: 10;
            position: relative;
            border: 1px solid rgba(197, 225, 165, 0.2);
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container:hover {
            transform: translateY(-8px);
            border: 1px solid var(--accent-spring);
        }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 12s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 {
            color: var(--accent-spring);
            font-size: 2.2rem;
            margin-bottom: 3rem;
            font-weight: 500;
            text-shadow: 0 0 15px rgba(197, 225, 165, 0.3);
        }

        .heart {
            display: inline-block;
            color: #f48fb1;
            animation: heartbeat 1.5s ease-in-out infinite;
            font-size: 2.8rem;
            vertical-align: middle;
        }

        @keyframes heartbeat {
            0%, 30%, 60% { transform: scale(1); }
            15% { transform: scale(1.15); }
            45% { transform: scale(1.08); }
        }

        .countdown-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 20px;
        }

        .number {
            font-size: 6.5rem;
            font-weight: 900;
            background: linear-gradient(120deg, #c5e1a5, #f48fb1, #fff59d, #c5e1a5);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 8s ease infinite;
            line-height: 0.9;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label {
            font-size: 1rem;
            color: var(--label-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .separator {
            font-size: 4.5rem;
            color: var(--separator-color);
            font-weight: 200;
            margin-top: -30px;
        }

        .progress-container {
            width: 80%;
            max-width: 600px;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin: 40px auto 10px;
            overflow: hidden;
            border: 1px solid rgba(197, 225, 165, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #388e3c, #c5e1a5);
            box-shadow: 0 0 15px rgba(197, 225, 165, 0.4);
            transition: width 1s ease-out;
        }

        .weeks-display {
            margin: 10px 0 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--separator-color);
            font-size: 1.3rem;
            color: var(--accent-spring);
            font-weight: 300;
        }

        .sleep-count {
            display: block;
            font-size: 1.1rem;
            color: #f8bbd0;
            margin-top: 8px;
        }

        .events-title {
            font-size: 1.2rem;
            color: var(--accent-spring);
            margin: 30px 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .events-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: var(--event-bg);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(197, 225, 165, 0.1);
            transition: all 0.3s ease;
        }

        .event-card:hover {
            background: rgba(197, 225, 165, 0.1);
            border-color: var(--accent-spring);
        }

        @media (max-width: 900px) {
            .countdown-wrapper { gap: 15px; }
            .number { font-size: 3.5rem; }
            .separator { font-size: 2rem; margin-top: -20px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Warten auf den Frühling mit dir <span class="heart">🌸</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group"><span class="number" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            Noch etwa <span id="weeks-count">0</span> Wochen voller Vorfreude.
            <span class="sleep-count">Nur noch <span id="sleep-total">0</span> Mal schlafen! 🌙</span>
        </div>

        <div class="events-title">Frühlings-Highlights 🗓️</div>
        <div class="events-list">
            <div class="event-card">
                <span class="event-date">14. Mai</span>
                <span class="event-name">Wiedersehen! 🥂</span>
            </div>
            <div class="event-card">
                <span class="event-date">30. Juli</span>
                <span class="event-name">The Weeknd Konzert 🎤</span>
            </div>
        </div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = '🌸';
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = Math.random() * 10 + 10 + 'px';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            petal.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 10000);
        }
        setInterval(createPetal, 400);

        const targetDate = new Date('May 14, 2026 18:00:00');
        const startDate = new Date('April 03, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = "<h1>Endlich wieder vereint! <span class='heart'>🌸</span></h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');

            const weeks = (diff / (1000 * 60 * 60 * 24 * 7)).toFixed(1);
            document.getElementById('weeks-count').innerText = weeks.replace('.', ',');

            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            let refDay = now.getDate();
            if (now.getHours() < 3) refDay -= 1;
            const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);

            const sleepDiff = Math.round((targetDay - referenceDate) / (1000 * 60 * 60 * 24));
            document.getElementById('sleep-total').innerText = Math.max(0, sleepDiff);

            const totalDuration = targetDate.getTime() - startDate;
            const elapsed = now.getTime() - startDate;
            const progressPercent = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);
            document.getElementById('progress-bar').style.width = progressPercent + '%';
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>

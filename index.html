<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Candy Spring: Rabsi & Finn</title>
    <style>
        :root {
            /* Ultra-helle Frühlings-Palette */
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #fffde7 50%, #fce4ec 100%);
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-main: #c2185b;
            --accent-pink: #f06292;
            --accent-yellow: #fdd835;
            --label-color: #777;
            --separator-color: #f8bbd0;
            --shadow: rgba(240, 98, 146, 0.15);
            --event-bg: rgba(255, 255, 255, 0.6);
            --glint-color: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #333;
            padding: 20px 0;
        }

        /* Mix Blütenblätter-Animation */
        .petal {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.2rem;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 4.5rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 25px 70px var(--shadow);
            width: 90%;
            max-width: 1000px;
            text-align: center;
            backdrop-filter: blur(8px);
            z-index: 10;
            position: relative;
            border: 2px solid #ffffff;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 80px rgba(240, 98, 146, 0.25);
        }

        /* Glint-Effekt */
        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            margin-bottom: 3rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .heart {
            display: inline-block;
            color: #e91e63;
            animation: heartbeat 1.5s ease-in-out infinite;
            font-size: 2.8rem;
            vertical-align: middle;
        }

        @keyframes heartbeat {
            0%, 30%, 60% { transform: scale(1); }
            15% { transform: scale(1.2); }
            45% { transform: scale(1.1); }
        }

        .countdown-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 25px;
        }

        .unit-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 6.5rem;
            font-weight: 900;
            background: linear-gradient(120deg, #ec407a, #fbc02d, #ec407a);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 0.9;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label {
            font-size: 1rem;
            color: var(--label-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .separator {
            font-size: 4.5rem;
            color: var(--separator-color);
            font-weight: 200;
            margin-top: -30px;
        }

        .progress-container {
            width: 80%;
            max-width: 600px;
            height: 14px;
            background: #f5f5f5;
            border-radius: 12px;
            margin: 40px auto 10px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f06292, #fdd835);
            box-shadow: 0 0 10px rgba(251, 192, 45, 0.3);
            transition: width 1s ease-out;
        }

        .weeks-display {
            margin: 15px 0 35px;
            padding-bottom: 35px;
            border-bottom: 1px solid var(--separator-color);
            font-size: 1.4rem;
            color: var(--text-main);
            font-weight: 300;
            line-height: 1.6;
        }

        .sleep-count {
            display: block;
            font-size: 1.1rem;
            color: #555;
            margin-top: 10px;
            font-weight: 400;
        }

        .events-title {
            font-size: 1.2rem;
            color: var(--text-main);
            margin: 30px 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .events-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: var(--event-bg);
            padding: 20px;
            border-radius: 30px;
            border: 1px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            background: #fff;
            border-color: var(--accent-pink);
            box-shadow: 0 15px 30px rgba(240, 98, 146, 0.15);
        }

        .event-date {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .event-name {
            display: block;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .countdown-wrapper { gap: 15px; }
            .number { font-size: 3.2rem; }
            .separator { font-size: 2rem; margin-top: -20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Warten auf den Frühling mit dir <span class="heart">❤️</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group"><span class="number" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            Das entspricht noch etwa <span id="weeks-count">0</span> Wochen.
            <span class="sleep-count">Nur noch <span id="sleep-total">0</span> Mal schlafen! 🌙</span>
        </div>

        <div class="events-title">Highlights bis dahin 🗓️</div>
        <div class="events-list">
            <div class="event-card">
                <span class="event-date">14. Mai</span>
                <span class="event-name">Wiedersehen! 🥂</span>
            </div>
            <div class="event-card">
                <span class="event-date">30. Juli</span>
                <span class="event-name">The Weeknd Konzert 🎤</span>
            </div>
        </div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = Math.random() > 0.5 ? '🌸' : '🌼';
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = Math.random() * 10 + 12 + 'px';
            petal.style.animationDuration = Math.random() * 5 + 6 + 's';
            petal.style.opacity = Math.random() * 0.6 + 0.4;
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 11000);
        }
        setInterval(createPetal, 450);

        const targetDate = new Date('May 14, 2026 18:00:00');
        const startDate = new Date('April 03, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = "<h1>Endlich wieder vereint! <span class='heart'>❤️</span></h1>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');

            const weeks = (diff / (1000 * 60 * 60 * 24 * 7)).toFixed(1);
            document.getElementById('weeks-count').innerText = weeks.replace('.', ',');

            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            let refDay = now.getDate();
            if (now.getHours() < 3) refDay -= 1;
            const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);
            const sleepDiff = Math.round((targetDay - referenceDate) / (1000 * 60 * 60 * 24));
            
            document.getElementById('sleep-total').innerText = Math.max(0, sleepDiff);

            const totalDuration = targetDate.getTime() - startDate;
            const elapsed = now.getTime() - startDate;
            const progressPercent = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);
            document.getElementById('progress-bar').style.width = progressPercent + '%';
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>

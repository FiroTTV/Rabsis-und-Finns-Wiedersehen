<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabsi's & Finn's Wiedersehen ❤️</title>
    <style>
        :root {
            /* Sommerliches Babyhellblau für den Hintergrund */
            --bg-gradient: linear-gradient(135deg, #e1f5fe 0%, #81d4fa 100%);
            /* Ozeanblau für die Kachel, damit das Weiß gut lesbar ist */
            --container-bg: linear-gradient(135deg, rgba(2, 119, 189, 0.75) 0%, rgba(1, 87, 155, 0.85) 100%);
            
            /* Sanftes Weiß für die Hauptschrift */
            --text-main: #f0f8ff; 
            --text-sub: #e1f5fe;
            
            /* Akzente */
            --accent-heart: #ff4757; 
            --label-color: #81d4fa; /* Helles Blau für Labels */
            --separator-color: rgba(255, 255, 255, 0.2);
            --shadow: rgba(1, 87, 155, 0.3);
            --event-bg: rgba(255, 255, 255, 0.15);
            --glint-color: rgba(255, 255, 255, 0.2);
            
            /* Cooler, blauer Verlauf für den Countdown */
            --main-gradient: linear-gradient(120deg, #00f2fe, #4facfe, #00f2fe);
            --progress-gradient: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #333;
            padding: 60px 0;
        }

        .umbrella {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: drift linear forwards;
            font-size: 1.5rem;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(-15deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(80px) rotate(15deg); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            padding: 5rem 2rem;
            border-radius: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 90%;
            max-width: 950px;
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(15px);
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .container:hover { transform: translateY(-8px); }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, var(--glint-color) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: glint 10s infinite ease-in-out;
        }

        @keyframes glint {
            0% { left: -150%; }
            15% { left: 150%; }
            100% { left: 150%; }
        }

        h1 { color: var(--text-main); font-weight: 500; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 2.5rem; margin-top: 0; }
        .events-title { font-size: 1.1rem; color: var(--text-main); margin: 40px 0 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        .heart { display: inline-block; color: var(--accent-heart); animation: heartbeat 1.5s ease-in-out infinite; font-size: 2.5rem; vertical-align: middle; }
        @keyframes heartbeat { 
            0%, 30%, 60% { transform: scale(1); } 
            15% { transform: scale(1.2); } 
            45% { transform: scale(1.1); } 
        }

        .countdown-wrapper { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
        .unit-group { display: flex; flex-direction: column; align-items: center; }
        
        .number {
            font-size: 5.5rem;
            font-weight: 900;
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            line-height: 1;
            background-image: var(--main-gradient);
            text-shadow: 0px 4px 15px rgba(0, 242, 254, 0.3); /* Sanfter blauer Glow-Effekt */
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .label { font-size: 0.85rem; color: var(--label-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; font-weight: 600; }
        .separator { font-size: 3.5rem; color: var(--separator-color); font-weight: 200; margin-bottom: 25px; }

        .progress-container { width: 80%; max-width: 600px; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin: 30px auto 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        .progress-bar { height: 100%; width: 0%; background: var(--progress-gradient); box-shadow: 0 0 10px rgba(0, 242, 254, 0.5); transition: width 1s ease-out; }

        .weeks-display { margin: 10px 0 40px; padding-bottom: 25px; border-bottom: 1px solid var(--separator-color); font-size: 1.3rem; color: var(--text-main); font-weight: 300; display: flex; flex-direction: column; align-items: center; }
        .minutes-count { display: block; font-size: 1rem; color: var(--text-sub); margin-top: 6px; font-weight: 400; }
        .sleep-count { display: block; font-size: 1.15rem; color: var(--text-main); margin-top: 8px; font-weight: bold; }

        .events-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; width: 100%; }
        .event-card { background: var(--event-bg); padding: 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .event-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.25); border-color: var(--label-color); box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2); }
        .event-date { display: block; font-size: 0.8rem; color: var(--label-color); margin-bottom: 5px; font-weight: 500; }
        .event-name { display: block; font-size: 1rem; color: var(--text-main); font-weight: bold; }

        @media (max-width: 900px) {
            .number { font-size: 3rem; }
            .countdown-wrapper { gap: 12px; }
            .separator { font-size: 1.8rem; margin-bottom: 20px;}
            h1 { font-size: 1.6rem; }
            .container { padding: 4rem 1.5rem; min-height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wiedersehen von Rabsi und Finn <span class="heart">❤️</span></h1>
        
        <div class="countdown-wrapper">
            <div class="unit-group"><span class="number" id="days">00</span><span class="label">Tage</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="hours">00</span><span class="label">Std</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="mins">00</span><span class="label">Min</span></div>
            <div class="separator">:</div>
            <div class="unit-group"><span class="number" id="secs">00</span><span class="label">Sek</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="weeks-display">
            <span>Das entspricht noch etwa <span id="weeks-count">0</span> Wochen.</span>
            <span class="minutes-count">Das entspricht etwa <span id="minutes-total">0</span> Minuten. ⏳</span>
            <span class="sleep-count">Nur noch <span id="sleep-total">0</span> Mal schlafen! 🌙</span>
        </div>

        <div class="events-title">Highlights 🗓️</div>
        <div class="events-list">
            <div class="event-card">
                <span class="event-date">06. Juli</span>
                <span class="event-name">Wiedersehen! 🥂</span>
            </div>
            <div class="event-card">
                <span class="event-date">30. Juli</span>
                <span class="event-name">The Weeknd Konzert 🎤</span>
            </div>
        </div>
    </div>

    <script>
        function createUmbrella() {
            const umbrella = document.createElement('div');
            umbrella.innerHTML = '⛱️';
            umbrella.className = 'umbrella';
            umbrella.style.left = Math.random() * 100 + 'vw';
            umbrella.style.fontSize = Math.random() * 15 + 20 + 'px';
            umbrella.style.animationDuration = Math.random() * 5 + 6 + 's';
            umbrella.style.opacity = Math.random() * 0.4 + 0.6;
            document.body.appendChild(umbrella);
            setTimeout(() => { umbrella.remove(); }, 11000);
        }
        setInterval(createUmbrella, 600);

        const targetDate = new Date('July 06, 2026 18:15:00');
        const startDate = new Date('May 17, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.querySelector('.container').innerHTML = "<h1>Endlich wieder vereint! <span class='heart'>❤️</span></h1>";
                return;
            }

            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');

            // Wochen
            document.getElementById('weeks-count').innerText = (diff / 604800000).toFixed(1).replace('.', ',');

            // Minuten-Logik (mit Tausender-Trennpunkt)
            const totalMinutes = Math.floor(diff / 60000);
            document.getElementById('minutes-total').innerText = totalMinutes.toLocaleString('de-DE');

            // Schlafen-Logik
            const targetDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            let refDay = now.getDate();
            if (now.getHours() < 3) refDay -= 1;
            const referenceDate = new Date(now.getFullYear(), now.getMonth(), refDay);
            document.getElementById('sleep-total').innerText = Math.max(0, Math.round((targetDay - referenceDate) / 86400000));

            // Fortschrittsbalken
            const progress = Math.min(Math.max(((now.getTime() - startDate) / (targetDate.getTime() - startDate)) * 100, 0), 100);
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
